# Single source of truth for every parameter used in the pipeline.
# Every number in the paper must trace back to a value in this file.

paths:
  # Raw data (not versioned; see data/README.md for how to obtain them)
  splot_header: "../contrib2/dataset/sPlotOpen_header.txt"
  splot_cwm: "../contrib2/dataset/sPlotOpen_CWM_CWV.txt"
  gbif_download: "../contrib2/0046318-260806074905277/0046318-260806074905277.csv"
  processed_dir: "data/processed"
  results_dir: "results"
  figures_dir: "figures"
  reports_dir: "reports"

gbif:
  doi: "10.15468/dl.ps65sp"
  download_key: "0046318-260806074905277"
  year_min: 2000            # coverage of the download (inclusive)
  year_max: 2025            # coverage of the download (inclusive)
  max_uncertainty_m: 10000
  # How to treat records with missing coordinateUncertaintyInMeters.
  # main = "keep"; the sensitivity analysis also runs "drop".
  missing_uncertainty: "keep"
  missing_uncertainty_sensitivity: ["keep", "drop"]
  dedup_round_deg: 0.01     # duplicates = same species + coords rounded to this + same year
  # basisOfRecord variants. "all" keeps every record; "no-ms" drops MATERIAL_SAMPLE
  # (mostly environmental DNA: soil/air/marine metabarcoding, INSDC sequences).
  basis_of_record_main: "no-ms"   # decided after Step 1 (eDNA detections are not disease reports)
  basis_of_record_sensitivity: ["all", "no-ms"]
  basis_of_record_excluded:
    no-ms: ["MATERIAL_SAMPLE"]

spatial:
  earth_radius_km: 6371.0088
  buffer_km: 50
  buffer_km_sensitivity: [25, 50, 100]

labels:
  horizons: [5, 7, 10]
  # A plot is eligible for horizon N only if its whole window (survey_year, survey_year+N]
  # lies within [gbif.year_min, gbif.year_max], i.e. survey_year >= year_min - 1 and
  # survey_year + N <= year_max.

features:
  traits: [LeafArea, StemDens, SLA, LeafC_perdrymass, LeafN, LeafP, PlantHeight, SeedMass,
           Seed_length, LDMC, LeafNperArea, LeafNPratio, Leaf_delta_15N, Seed_num_rep_unit,
           Leaffreshmass, Stem_cond_dens, Disp_unit_leng, Wood_vessel_length]
  plot_attrs: [Species_richness, TraitCoverage_cover, TraitCoverage_pa]
  env: [SoilClim_PC1, SoilClim_PC2]
  meta: [PlotObservationID, Dataset, GIVD_ID, Continent, Country, Biome, Date_of_recording,
         Latitude, Longitude, Location_uncertainty]

report:
  survey_year_bins: [1999, 2003, 2007, 2011, 2016]   # right-open bins

evaluation:
  block_km: 500           # spatial block size for blocked CV
  n_folds: 5
  n_inner: 5              # inner validation = 1/n_inner of the training blocks
  split_seed: 42
  stratify_horizon: 10    # folds stratified on the N=10 label (same folds for all horizons)
  tuning_horizon: 10      # hyperparameters tuned once per outer fold on this horizon's inner-val
                          # PR-AUC, then refitted for every horizon (same rule for every model)

seeds: [0, 1, 2, 3, 4]

tabular:
  n_trials: 30            # Optuna TPE trials per (model, feature set, horizon, outer fold)
  fixed:
    rf_n_estimators: 300
    lgbm_max_rounds: 2000
    lgbm_early_stopping: 50
    mlp_max_epochs: 200
    mlp_batch: 2048
    patience: 20
  # [type, low, high, log] or [cat, choices]
  search_space:
    lr:
      C: [float, 1.0e-4, 10.0, true]
      balanced: [cat, [true, false]]
    rf:
      max_depth: [cat, [0, 8, 16, 32]]          # 0 = unlimited
      min_samples_leaf: [int, 1, 64, true]
      max_features: [float, 0.05, 0.7]
      class_weight: [cat, [none, balanced, balanced_subsample]]
    lgbm:
      learning_rate: [float, 0.01, 0.2, true]
      num_leaves: [int, 8, 256, true]
      min_child_samples: [int, 5, 200, true]
      subsample: [float, 0.5, 1.0]
      colsample_bytree: [float, 0.3, 1.0]
      reg_lambda: [float, 1.0e-3, 10.0, true]
      balanced: [cat, [true, false]]
    mlp:
      hidden: [cat, [64, 128, 256]]
      n_layers: [int, 1, 3]
      dropout: [float, 0.0, 0.5]
      lr: [float, 1.0e-4, 1.0e-2, true]
      weight_decay: [float, 1.0e-6, 1.0e-3, true]
      balanced: [cat, [true, false]]

graph:
  k: 10
  k_sensitivity: [5, 10, 20]
  n_trials: 30            # overwritten only if the compute budget forces it (documented)
  max_epochs: 200
  patience: 20
  search_space:
    gnn:
      hidden: [cat, [64, 128]]             # total width (GAT heads split it)
      heads: [cat, [2, 4]]                 # used by GAT models only
      dropout: [float, 0.0, 0.5]
      lr: [float, 1.0e-3, 1.0e-2, true]
      weight_decay: [float, 1.0e-6, 1.0e-3, true]
      balanced: [cat, [true, false]]

effort:
  # Independent effort layer (src/01c_effort_layer.py): GBIF API counts of non-target Fungi.
  cell_deg: 0.5
  api_workers: 2

holdout:
  # Sealed confirmatory test set (decision D10). Never used in pilots or tuning.
  fraction: 0.15          # target share of plots, per continent x effort-tercile stratum
  seed: 20261117
  splits_file: splits_v2.parquet

d13:
  # Pre-registration D13 (reports/preregistration_D13.md, tag prereg-D13)
  primary_horizon: 5
  tuning_horizon: 5          # hyperparameters reused for N = 7 and 10
  horizons: [5, 7, 10]
  seeds: [0, 1, 2, 3, 4]
  n_trials: 30
  n_boot: 2000
  alldev_inner_seed_offset: 500   # inner validation of the whole development set: split_seed + 500
  max_epochs: 200
  patience: 20
  gnn_space:
    encoder: [cat, [identity, linear, mlp]]   # EcoPE models only
    hidden: [cat, [64, 128]]
    heads: [cat, [2, 4]]
    dropout: [float, 0.1, 0.5]
    lr: [float, 1.0e-4, 1.0e-2, true]
    weight_decay: [float, 1.0e-6, 1.0e-3, true]
d14:
  # Pre-registration addendum D14 (reports/preregistration_D14.md, tag prereg-D14).
  # Protocol (horizons, seeds, trials, epochs, bootstrap) = d13 section; only the space differs.
  asof_space:
    encoder: [cat, [identity, linear, mlp]]
    hidden: [cat, [64, 128]]
    dropout: [float, 0.1, 0.5]
    lr: [float, 1.0e-4, 1.0e-2, true]
    weight_decay: [float, 1.0e-6, 1.0e-3, true]
